packages:
  - .
  - apps/*
  - packages/*

minimumReleaseAge: 2880

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

catalog:
  '@changesets/cli': ^3.0.0
  '@earendil-works/pi-ai': 1.1.0
  '@earendil-works/pi-coding-agent': 1.1.0
  '@earendil-works/pi-tui': 1.1.0
  '@fontsource-variable/victor-mono': ^5.2.8
  '@fontsource/victor-mono': ^5.2.8
  '@internationalized/date': ^3.12.1
  '@playwright/test': ^1.60.0
  '@resvg/resvg-js': ^2.6.2
  '@sveltejs/adapter-cloudflare': ^8.0.0
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/vite-plugin-svelte': ^7.1.2
  '@tailwindcss/vite': ^4.3.0
  '@twinkleplop/bash': ^0.1.5
  '@twinkleplop/markdown-core': ^0.2.0
  '@twinkleplop/typescript': ^0.1.5
  '@types/node': ^25.8.0
  '@typescript/native': npm:typescript@^7.0.2
  '@vitest/browser-playwright': 5.0.1
  '@vitest/coverage-v8': 5.0.1
  bits-ui: ^2.18.1
  citty: ^0.2.2
  clsx: ^2.1.1
  phosphor-svelte: ^3.1.0
  pirecall: ^0.1.3
  playwright: ^1.60.0
  shadcn-svelte: ^1.2.7
  svead: ^0.0.16
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  tailwind-merge: ^3.6.0
  tailwind-variants: ^3.2.2
  tailwindcss: ^4.3.0
  tw-animate-css: ^1.4.0
  typebox: ^1.1.38
  typescript: ^7.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  vitest-browser-svelte: ^3.0.0
  wrangler: ^4.118.0

catalogs:
  typescript6:
    typescript: ^6.0.3

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@google/genai'
  - esbuild
  - protobufjs
  - sharp
  - workerd

peerDependencyRules:
  allowedVersions:
    # Vite+ core exposes Vite 8 APIs but uses Vite+'s package version.
    vite: '1.0.0'
