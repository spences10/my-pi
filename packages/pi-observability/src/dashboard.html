<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>Pi Observability</title>
		<link rel="stylesheet" href="/dashboard.css" />
	</head>
	<body>
		<header>
			<div class="brand">
				<div class="mark" aria-hidden="true"></div>
				<div>
					<h1>Pi Observability</h1>
					<div class="db-path" title="__DB_PATH__">
						DB: __DB_PATH__ · served: __BUILD__
					</div>
				</div>
			</div>
			<div class="toolbar">
				<span id="live" class="pill"
					><span class="live-dot"></span> connecting</span
				>
				<div class="view-buttons">
					<button id="single_btn" class="active">Single</button>
					<button id="trace_btn">Trace</button>
					<button id="swimlane_btn">Swimlane</button>
					<button id="race_btn">Race</button>
				</div>
				<button id="pause_btn">Pause</button>
			</div>
		</header>
		<div class="layout">
			<aside>
				<div class="filters">
					<div class="stats">
						<div class="stat">
							<strong id="session_count">0</strong
							><span>sessions</span>
						</div>
						<div class="stat">
							<strong id="event_count">0</strong><span>events</span>
						</div>
						<div class="stat">
							<strong id="visible_count">0</strong
							><span>visible</span>
						</div>
					</div>
					<input
						id="search_input"
						placeholder="Filter sessions, pools, models…"
					/>
					<select id="type_filter">
						<option value="">All event types</option>
					</select>
					<input
						id="event_search_input"
						placeholder="Search event payloads…"
					/>
				</div>
				<div id="sessions"></div>
			</aside>
			<section class="events">
				<div class="inspector">
					<div id="overview"></div>
					<div class="timeline-shell">
						<div class="timeline-label">Trace timeline</div>
						<div id="timeline"></div>
					</div>
				</div>
				<div id="single_view" class="view"></div>
				<div id="trace_view" class="hidden view trace"></div>
				<div id="swimlane_view" class="hidden view swimlane"></div>
				<div id="race_view" class="hidden view race"></div>
			</section>
		</div>
		<script type="module" src="/dashboard.js"></script>
	</body>
</html>
