name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'apps/web/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before
            }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "root=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_web=false
          has_root=false
          while IFS= read -r file; do
            case "$file" in
              apps/web/*) has_web=true ;;
              pnpm-lock.yaml) ;;
              *) has_root=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          if [ "$has_root" = true ] || [ "$has_web" = false ]; then
            echo "root=true" >> "$GITHUB_OUTPUT"
          else
            echo "root=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run:
          pnpm install --frozen-lockfile --filter . --filter
          "./packages/*"

      - name: Check (lint + format)
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Run smoke eval suite
        run: pnpm run eval:suite

      - name: Verify CLI works
        run: node dist/index.js --help
